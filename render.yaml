# Render Blueprint for the DClaw RAG backend (FastAPI, Docker).
# Frontend deploys to Vercel; vectors live in Qdrant Cloud (free tier);
# Redis is a Render Key Value instance. See DEPLOY.md § Render.
#
# RAM note: the default models (bge-large + bge-reranker-base) need ~2.5 GB.
# This blueprint pins a small embedding model so the service fits a 2 GB
# Standard instance; unset EMBEDDING_MODEL to go back to the default on a
# bigger plan. Free/starter (512 MB) instances will OOM — don't use them.
#
# The Celery ingestion worker runs inside the same container (single paid
# service instead of two); split it into its own worker service when
# ingestion volume justifies it.
services:
  - type: web
    name: dclaw-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    dockerCommand: >-
      bash -c "celery -A app.worker.celery_app worker --queues ingestion
      --concurrency 1 --loglevel info &
      uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      # Small dense model (384-dim) to fit the 2 GB instance.
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      # Qdrant Cloud cluster URL + API key (free tier: https://cloud.qdrant.io)
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dclaw-rag-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dclaw-rag-redis
          property: connectionString
      # JSON list of allowed browser origins — set to the Vercel app URL,
      # e.g. ["https://dclaw-rag-app.vercel.app"]
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Production config validation requires these (validate_runtime_config).
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  - type: keyvalue
    name: dclaw-rag-redis
    plan: free
    ipAllowList: []
