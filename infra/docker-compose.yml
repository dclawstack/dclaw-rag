version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - APP_ENV=dev
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8090
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - EMBEDDING_DEVICE=cpu
    env_file:
      - ../.env
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A app.tasks worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    env_file:
      - ../.env
    depends_on:
      - redis

volumes:
  qdrant_storage:
  redis_data:
