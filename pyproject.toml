[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dclaw-rag"
version = "0.1.0"
description = "DCLAW Retrieval-Augmented Generation system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.9.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.3.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "python-multipart>=0.0.9",
    "unstructured[pdf]>=0.14.0",
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "orjson>=3.10.0",
    "jinja2>=3.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# B008: function call in argument default is the FastAPI Depends/Header idiom.
ignore = ["B008"]

[tool.mypy]
# A real type gate without strict-mode churn: catch genuine type errors
# (bad args, missing returns) but don't require dict[...]-generics or ban Any.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
