name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
      - 'PATCH-*.md'
      - 'PATCHES.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
      - 'PATCH-*.md'
      - 'PATCHES.md'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install CPU-only torch
        # Avoids ~5GB of CUDA wheels; the app runs on CPU. Must precede the
        # editable install so torch is already satisfied.
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app/ tests/ scripts/
      - name: Type-check (mypy)
        run: mypy app/
      - name: Security audit (pip-audit)
        # setuptools<78.1.1 carries PYSEC-2025-49; torch pins <82, so bump into
        # the safe window before auditing. The editable package and the local
        # CPU torch wheels can't be resolved on PyPI and are skipped.
        run: |
          uv pip install --system "setuptools>=78.1.1,<82"
          pip-audit --skip-editable
      - name: Run tests (with coverage gate)
        run: python -m pytest --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

  local-mode-e2e:
    # Boots the full API in APP_MODE=local (SQLite KV + embedded Qdrant +
    # inline ingestion, real embedding/reranker models) and runs an
    # ingest -> query round-trip with zero external services.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache embedding/reranker models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: hf-models-local-mode-v1
      - name: Install uv
        run: pip install uv
      - name: Install CPU-only torch
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Local-mode e2e (zero external services)
        env:
          LOCAL_MODE_E2E: "1"
        run: python -m pytest tests/integration/test_local_mode.py -v
        timeout-minutes: 25

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint (eslint)
        working-directory: ./frontend
        run: npm run lint
      - name: Unit tests (vitest)
        working-directory: ./frontend
        run: npm test
      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8090
        run: npm run build
        timeout-minutes: 5
