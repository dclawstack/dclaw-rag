name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
      - 'PATCH-*.md'
      - 'PATCHES.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
      - 'PATCH-*.md'
      - 'PATCHES.md'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install CPU-only torch
        # Avoids ~5GB of CUDA wheels; the app runs on CPU. Must precede the
        # editable install so torch is already satisfied.
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8090
        run: npm run build
        timeout-minutes: 5
