{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dclaw-app.fullname" . }}-backend
  labels:
    app: {{ include "dclaw-app.name" . }}
    component: backend
spec:
  selector:
    matchLabels:
      app: {{ include "dclaw-app.name" . }}
      component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
