apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-app.fullname" . }}-env
type: Opaque
stringData:
  # Non-secret config
  APP_ENV: {{ .Values.config.appEnv | quote }}
  QDRANT_URL: {{ .Values.config.qdrantUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.config.celeryBrokerUrl | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  EMBEDDING_DEVICE: {{ .Values.config.embeddingDevice | quote }}
  CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}
  # Secrets (override per environment; the prod config check rejects blanks/dev defaults)
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  BOOTSTRAP_API_KEY: {{ .Values.secrets.bootstrapApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
