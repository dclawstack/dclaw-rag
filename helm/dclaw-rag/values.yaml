replicaCount: 2

backend:
  image:
    repository: ghcr.io/dclawstack/dclaw-rag
    tag: latest
    pullPolicy: IfNotPresent
  port: 8090
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    - name: APP_ENV
      value: "production"
    - name: API_HOST
      value: "0.0.0.0"
    - name: API_PORT
      value: "8090"
    - name: QDRANT_URL
      value: "http://dclaw-rag-qdrant:6333"
    - name: REDIS_URL
      value: "redis://dclaw-rag-redis:6379/0"
    - name: CELERY_BROKER_URL
      value: "redis://dclaw-rag-redis:6379/1"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: dclaw-rag-secrets
          key: openai-api-key

qdrant:
  image: qdrant/qdrant:latest
  storage: 10Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m

redis:
  image: redis:7-alpine
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

ingress:
  enabled: true
  className: nginx
  host: rag.dclawstack.io
  tls:
    enabled: true
    secretName: dclaw-rag-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

service:
  type: ClusterIP

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
