apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-rag.fullname" . }}-backend
  labels:
    {{- include "dclaw-rag.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "dclaw-rag.selectorLabels" . | nindent 4 }}
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-rag.fullname" . }}-qdrant
  labels:
    {{- include "dclaw-rag.labels" . | nindent 4 }}
    component: qdrant
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
      name: grpc
    - port: 6334
      targetPort: 6334
      protocol: TCP
      name: rest
  selector:
    {{- include "dclaw-rag.selectorLabels" . | nindent 4 }}
    component: qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-rag.fullname" . }}-redis
  labels:
    {{- include "dclaw-rag.labels" . | nindent 4 }}
    component: redis
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "dclaw-rag.selectorLabels" . | nindent 4 }}
    component: redis
